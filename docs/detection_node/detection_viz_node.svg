<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#27364D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1400" height="1360" fill="#F7F9FC"/>
  <g filter="url(#shadow)">
    <rect x="50" y="44" width="1300" height="190" rx="28" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="2"/><text x="88" y="108" font-size="40" font-weight="800" fill="#172033">detection_viz_node</text><text x="88" y="150" font-size="22" font-weight="500" fill="#2B5CE6">调试节点，把 tracked_objects 叠加到图像上并输出可视化结果。</text><text x="88" y="184" font-size="18" font-weight="400" fill="#5B6475"><tspan x="88" y="184">包: detection_node    可执行: detection_viz_node_exe</tspan><tspan x="88" y="208">源码: ros2_ws/src/detection_node/src/detection_viz_node.cpp</tspan><tspan x="88" y="232">入口/参数: 当前代码树未提供独立 launch; 默认不在主链中</tspan></text>
    <rect x="50" y="260" width="630" height="238" rx="22" fill="#E7F0FF" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="306" font-size="24" font-weight="700" fill="#172033">输入是什么</text><text x="78" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="346">- 话题: /camera/image_mono</tspan><tspan x="78" y="376">- 话题: /tracked_objects</tspan><tspan x="78" y="406">- 按时间戳在图像缓冲区中找匹配帧</tspan></text><rect x="720" y="260" width="630" height="238" rx="22" fill="#E9F8EE" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="306" font-size="24" font-weight="700" fill="#172033">输出是什么</text><text x="748" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="346">- 话题: /camera/image_detected</tspan><tspan x="748" y="376">- 类型: sensor_msgs/msg/Image</tspan><tspan x="748" y="406">- 内容: 带框、ID、类别、置信度的叠加图</tspan></text><rect x="50" y="528" width="630" height="388" rx="22" fill="#FFF4DD" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="574" font-size="24" font-weight="700" fill="#172033">内部状态是什么</text><text x="78" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="614">- image_buffer_: 最近图像 deque</tspan><tspan x="78" y="644">- image_buffer_mutex_: 保护缓冲区</tspan><tspan x="78" y="674">- 缓冲上限: 15 帧</tspan><tspan x="78" y="704">- 回退容忍: 250 ms</tspan></text><rect x="720" y="528" width="630" height="388" rx="22" fill="#F1EBFF" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="574" font-size="24" font-weight="700" fill="#172033">线程 / 定时器 / 队列在哪里</text><text x="748" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="614">- OnImage: 入缓冲</tspan><tspan x="748" y="644">- OnDetections: 按 stamp 找图并叠加</tspan><tspan x="748" y="674">- 无定时器, 无后台线程</tspan><tspan x="748" y="704">- 无显式工作队列, 只有 deque 缓冲</tspan></text><rect x="50" y="946" width="1300" height="304" rx="22" fill="#EDF2F7" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="992" font-size="24" font-weight="700" fill="#172033">参数从哪里进来</text><text x="78" y="1032" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="1032">- 没有 declare_parameter</tspan><tspan x="78" y="1062">- 缓冲大小和容忍时间都是源码常量</tspan><tspan x="78" y="1092">- 通常手动调试时单独启动</tspan></text>
  </g>
  <text x="700" y="1320" text-anchor="middle" font-size="16" fill="#5B6475">仅覆盖 ros2_ws/src 中的真实 ROS 节点；不包含 vision_front 这类组合进程入口。</text>
</svg>
