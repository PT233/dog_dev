<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#27364D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1400" height="1360" fill="#F7F9FC"/>
  <g filter="url(#shadow)">
    <rect x="50" y="44" width="1300" height="190" rx="28" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="2"/><text x="88" y="108" font-size="40" font-weight="800" fill="#172033">leg_motion_node</text><text x="88" y="150" font-size="22" font-weight="500" fill="#2B5CE6">把像素误差变成四足舵机目标角命令，是视觉到运动的控制核心。</text><text x="88" y="184" font-size="18" font-weight="400" fill="#5B6475"><tspan x="88" y="184">包: visual_servo    可执行: visual_servo_node_exe</tspan><tspan x="88" y="208">源码: ros2_ws/src/visual_servo/src/leg_motion_controller_node.cpp</tspan><tspan x="88" y="232">入口/参数: ros2_ws/src/visual_servo/launch/visual_servo.launch.py</tspan></text>
    <rect x="50" y="260" width="630" height="238" rx="22" fill="#E7F0FF" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="306" font-size="24" font-weight="700" fill="#172033">输入是什么</text><text x="78" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="346">- 话题: /pixel_error</tspan><tspan x="78" y="376">- 话题: /servo_state</tspan><tspan x="78" y="406">- pixel_error 决定前进与转向控制量</tspan></text><rect x="720" y="260" width="630" height="238" rx="22" fill="#E9F8EE" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="306" font-size="24" font-weight="700" fill="#172033">输出是什么</text><text x="748" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="346">- 话题: /servo_cmd</tspan><tspan x="748" y="376">- 类型: sensor_msgs/msg/JointState</tspan><tspan x="748" y="406">- 内容: 4 路腿舵机目标角, 单位弧度</tspan></text><rect x="50" y="528" width="630" height="388" rx="22" fill="#FFF4DD" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="574" font-size="24" font-weight="700" fill="#172033">内部状态是什么</text><text x="78" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="614">- pixel_error_x_/pixel_error_y_</tspan><tspan x="78" y="644">- current_leg_angles_deg_[4]</tspan><tspan x="78" y="674">- have_pixel_error_, last_pixel_error_time_</tspan><tspan x="78" y="704">- pid_turn_ / pid_forward_</tspan><tspan x="78" y="734">- gait_phase_rad_, last_control_time_</tspan></text><rect x="720" y="528" width="630" height="388" rx="22" fill="#F1EBFF" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="574" font-size="24" font-weight="700" fill="#172033">线程 / 定时器 / 队列在哪里</text><text x="748" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="614">- 2 个订阅回调: OnPixelError / OnServoState</tspan><tspan x="748" y="644">- 1 个 wall timer: control_timer_</tspan><tspan x="748" y="674">- 默认控制频率: 30 Hz</tspan><tspan x="748" y="704">- 无后台线程, 无显式队列</tspan></text><rect x="50" y="946" width="1300" height="304" rx="22" fill="#EDF2F7" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="992" font-size="24" font-weight="700" fill="#172033">参数从哪里进来</text><text x="78" y="1032" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="1032">- launch 加载顶层 config/visual_servo.yaml</tspan><tspan x="78" y="1062">- 参数族: control_rate/deadband/angle_limit/gait</tspan><tspan x="78" y="1092">- 参数族: turn PID + forward PID</tspan></text>
  </g>
  <text x="700" y="1320" text-anchor="middle" font-size="16" fill="#5B6475">仅覆盖 ros2_ws/src 中的真实 ROS 节点；不包含 vision_front 这类组合进程入口。</text>
</svg>
