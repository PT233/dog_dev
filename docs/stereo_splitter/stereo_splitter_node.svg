<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#27364D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1400" height="1360" fill="#F7F9FC"/>
  <g filter="url(#shadow)">
    <rect x="50" y="44" width="1300" height="190" rx="28" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="2"/><text x="88" y="108" font-size="40" font-weight="800" fill="#172033">stereo_splitter_node</text><text x="88" y="150" font-size="22" font-weight="500" fill="#2B5CE6">从双目拼接图中裁出左目图像，给检测节点使用。</text><text x="88" y="184" font-size="18" font-weight="400" fill="#5B6475"><tspan x="88" y="184">包: stereo_splitter    可执行: stereo_splitter_node</tspan><tspan x="88" y="208">源码: ros2_ws/src/stereo_splitter/src/stereo_splitter_node.cpp</tspan><tspan x="88" y="232">入口/参数: ros2_ws/src/stereo_splitter/launch/stereo_splitter.launch.py</tspan></text>
    <rect x="50" y="260" width="630" height="238" rx="22" fill="#E7F0FF" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="306" font-size="24" font-weight="700" fill="#172033">输入是什么</text><text x="78" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="346">- 话题: /stereo/image_raw</tspan><tspan x="78" y="376">- 类型: sensor_msgs/msg/Image</tspan><tspan x="78" y="406">- 期望编码: bgr8</tspan></text><rect x="720" y="260" width="630" height="238" rx="22" fill="#E9F8EE" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="306" font-size="24" font-weight="700" fill="#172033">输出是什么</text><text x="748" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="346">- 话题: /camera/image_mono</tspan><tspan x="748" y="376">- 类型: sensor_msgs/msg/Image</tspan><tspan x="748" y="406">- 内容: 左半边 320x480 图像</tspan></text><rect x="50" y="528" width="630" height="388" rx="22" fill="#FFF4DD" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="574" font-size="24" font-weight="700" fill="#172033">内部状态是什么</text><text x="78" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="614">- image_sub_: 输入订阅</tspan><tspan x="78" y="644">- left_pub_: 输出发布</tspan><tspan x="78" y="674">- 没有独立算法状态或缓存容器</tspan></text><rect x="720" y="528" width="630" height="388" rx="22" fill="#F1EBFF" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="574" font-size="24" font-weight="700" fill="#172033">线程 / 定时器 / 队列在哪里</text><text x="748" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="614">- 单个订阅回调 image_callback</tspan><tspan x="748" y="644">- 无定时器, 无后台线程</tspan><tspan x="748" y="674">- 无显式队列</tspan><tspan x="748" y="704">- 按行 memcpy, 避免整帧 clone</tspan></text><rect x="50" y="946" width="1300" height="304" rx="22" fill="#EDF2F7" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="992" font-size="24" font-weight="700" fill="#172033">参数从哪里进来</text><text x="78" y="1032" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="1032">- 没有 declare_parameter</tspan><tspan x="78" y="1062">- launch 文件不传参</tspan><tspan x="78" y="1092">- 320x480 左目裁切范围直接写在源码里</tspan></text>
  </g>
  <text x="700" y="1320" text-anchor="middle" font-size="16" fill="#5B6475">仅覆盖 ros2_ws/src 中的真实 ROS 节点；不包含 vision_front 这类组合进程入口。</text>
</svg>
