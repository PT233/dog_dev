<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#27364D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1400" height="1360" fill="#F7F9FC"/>
  <g filter="url(#shadow)">
    <rect x="50" y="44" width="1300" height="190" rx="28" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="2"/><text x="88" y="108" font-size="40" font-weight="800" fill="#172033">behavior_node</text><text x="88" y="150" font-size="22" font-weight="500" fill="#2B5CE6">从 tracked_objects 中选出当前目标类别，并计算画面像素误差。</text><text x="88" y="184" font-size="18" font-weight="400" fill="#5B6475"><tspan x="88" y="184">包: behavior_node    可执行: behavior_node_exe</tspan><tspan x="88" y="208">源码: ros2_ws/src/behavior_node/src/behavior_node.cpp</tspan><tspan x="88" y="232">入口/参数: ros2_ws/src/behavior_node/launch/behavior.launch.py</tspan></text>
    <rect x="50" y="260" width="630" height="238" rx="22" fill="#E7F0FF" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="306" font-size="24" font-weight="700" fill="#172033">输入是什么</text><text x="78" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="346">- 话题: /tracked_objects</tspan><tspan x="78" y="376">- 服务: /set_target_class</tspan><tspan x="78" y="406">- 附加文件: models/coco_classes.txt</tspan></text><rect x="720" y="260" width="630" height="238" rx="22" fill="#E9F8EE" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="306" font-size="24" font-weight="700" fill="#172033">输出是什么</text><text x="748" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="346">- 话题: /pixel_error</tspan><tspan x="748" y="376">- 类型: geometry_msgs/msg/Vector3</tspan><tspan x="748" y="406">- 含义: (target_cx-center_x, target_cy-center_y, 0)</tspan></text><rect x="50" y="528" width="630" height="388" rx="22" fill="#FFF4DD" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="574" font-size="24" font-weight="700" fill="#172033">内部状态是什么</text><text x="78" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="614">- target_class_id_ / current_track_id_</tspan><tspan x="78" y="644">- target_cx_ / target_cy_</tspan><tspan x="78" y="674">- image_width_ / image_height_ / center_x_ / center_y_</tspan><tspan x="78" y="704">- coco_classes_: 类别 ID 到名称映射</tspan></text><rect x="720" y="528" width="630" height="388" rx="22" fill="#F1EBFF" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="574" font-size="24" font-weight="700" fill="#172033">线程 / 定时器 / 队列在哪里</text><text x="748" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="614">- OnTrackedObjects: 选目标并发布误差</tspan><tspan x="748" y="644">- OnSetTargetClass: 运行时切换类别</tspan><tspan x="748" y="674">- 无定时器, 无后台线程</tspan><tspan x="748" y="704">- 无显式队列</tspan><tspan x="748" y="734">- 当前选目标策略: 同类里面积最大者</tspan></text><rect x="50" y="946" width="1300" height="304" rx="22" fill="#EDF2F7" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="992" font-size="24" font-weight="700" fill="#172033">参数从哪里进来</text><text x="78" y="1032" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="1032">- launch 加载顶层 config/behavior.yaml</tspan><tspan x="78" y="1062">- 源码默认值: image_width/image_height/center_x/center_y</tspan><tspan x="78" y="1092">- 类别名称不是参数, 而是从 coco_classes.txt 读取</tspan></text>
  </g>
  <text x="700" y="1320" text-anchor="middle" font-size="16" fill="#5B6475">仅覆盖 ros2_ws/src 中的真实 ROS 节点；不包含 vision_front 这类组合进程入口。</text>
</svg>
