<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#27364D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1400" height="1360" fill="#F7F9FC"/>
  <g filter="url(#shadow)">
    <rect x="50" y="44" width="1300" height="190" rx="28" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="2"/><text x="88" y="108" font-size="40" font-weight="800" fill="#172033">gst_receiver_node</text><text x="88" y="150" font-size="22" font-weight="500" fill="#2B5CE6">把 Raspberry Pi 发来的 UDP/H.264 视频解码成 ROS 图像。</text><text x="88" y="184" font-size="18" font-weight="400" fill="#5B6475"><tspan x="88" y="184">包: gst_receiver    可执行: gst_receiver_node</tspan><tspan x="88" y="208">源码: ros2_ws/src/gst_receiver/src/gst_receiver_node.cpp</tspan><tspan x="88" y="232">入口/参数: ros2_ws/src/gst_receiver/launch/gst_receiver.launch.py</tspan></text>
    <rect x="50" y="260" width="630" height="238" rx="22" fill="#E7F0FF" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="306" font-size="24" font-weight="700" fill="#172033">输入是什么</text><text x="78" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="346">- 非 ROS 输入: UDP/H.264 :5600</tspan><tspan x="78" y="376">- RTP caps: payload=96, media=video</tspan><tspan x="78" y="406">- 来源: Raspberry Pi 相机推流脚本</tspan></text><rect x="720" y="260" width="630" height="238" rx="22" fill="#E9F8EE" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="306" font-size="24" font-weight="700" fill="#172033">输出是什么</text><text x="748" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="346">- 话题: /stereo/image_raw</tspan><tspan x="748" y="376">- 类型: sensor_msgs/msg/Image</tspan><tspan x="748" y="406">- 编码: bgr8, frame_id=camera</tspan></text><rect x="50" y="528" width="630" height="388" rx="22" fill="#FFF4DD" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="574" font-size="24" font-weight="700" fill="#172033">内部状态是什么</text><text x="78" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="614">- pipeline_: GStreamer pipeline</tspan><tspan x="78" y="644">- bus_: GStreamer bus</tspan><tspan x="78" y="674">- hw_decode_enabled_: 是否启用 nvh264dec</tspan><tspan x="78" y="704">- image_pub_: ROS 图像发布器</tspan></text><rect x="720" y="528" width="630" height="388" rx="22" fill="#F1EBFF" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="574" font-size="24" font-weight="700" fill="#172033">线程 / 定时器 / 队列在哪里</text><text x="748" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="614">- 无 ROS 定时器</tspan><tspan x="748" y="644">- GStreamer new-sample 回调负责出帧</tspan><tspan x="748" y="674">- bus watch 回调负责报错/EOS</tspan><tspan x="748" y="704">- appsink: max-buffers=2, drop=true</tspan><tspan x="748" y="734">- rtpjitterbuffer latency=50</tspan></text><rect x="50" y="946" width="1300" height="304" rx="22" fill="#EDF2F7" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="992" font-size="24" font-weight="700" fill="#172033">参数从哪里进来</text><text x="78" y="1032" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="1032">- 没有 declare_parameter</tspan><tspan x="78" y="1062">- launch 文件不传参</tspan><tspan x="78" y="1092">- 端口 5600、解码链路、caps 都写死在源码里</tspan></text>
  </g>
  <text x="700" y="1320" text-anchor="middle" font-size="16" fill="#5B6475">仅覆盖 ros2_ws/src 中的真实 ROS 节点；不包含 vision_front 这类组合进程入口。</text>
</svg>
