<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#27364D" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1400" height="1360" fill="#F7F9FC"/>
  <g filter="url(#shadow)">
    <rect x="50" y="44" width="1300" height="190" rx="28" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="2"/><text x="88" y="108" font-size="40" font-weight="800" fill="#172033">uart_bridge_node</text><text x="88" y="150" font-size="22" font-weight="500" fill="#2B5CE6">把 ROS 的 /servo_cmd 转成 UART 帧发给 STM32，再把状态帧还原成 /servo_state。</text><text x="88" y="184" font-size="18" font-weight="400" fill="#5B6475"><tspan x="88" y="184">包: uart_bridge    可执行: uart_bridge_node</tspan><tspan x="88" y="208">源码: ros2_ws/src/uart_bridge/src/uart_bridge_transport.cpp</tspan><tspan x="88" y="232">入口/参数: ros2_ws/src/uart_bridge/launch/uart_bridge.launch.py</tspan></text>
    <rect x="50" y="260" width="630" height="238" rx="22" fill="#E7F0FF" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="306" font-size="24" font-weight="700" fill="#172033">输入是什么</text><text x="78" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="346">- 话题: /servo_cmd</tspan><tspan x="78" y="376">- 非 ROS 输入: /dev/ttyAMA0 字节流</tspan><tspan x="78" y="406">- 串口状态帧: SYSTEM_STATE / SERVO_STATE_V2</tspan></text><rect x="720" y="260" width="630" height="238" rx="22" fill="#E9F8EE" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="306" font-size="24" font-weight="700" fill="#172033">输出是什么</text><text x="748" y="346" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="346">- 话题: /servo_state</tspan><tspan x="748" y="376">- 非 ROS 输出: UART 握手帧与舵机控制帧</tspan><tspan x="748" y="406">- 附带统计: 丢包与时延日志</tspan></text><rect x="50" y="528" width="630" height="388" rx="22" fill="#FFF4DD" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="574" font-size="24" font-weight="700" fill="#172033">内部状态是什么</text><text x="78" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="614">- uart_fd_, parser_, encoder_</tspan><tspan x="78" y="644">- handshake_complete_, stm32_system_state_</tspan><tspan x="78" y="674">- handshake_tx_count_, frame_error_count_, frame_receive</tspan><tspan x="78" y="704">d_count_</tspan><tspan x="78" y="734">- timestamp_mapper_, latency_monitor_, sequence_checker_</tspan></text><rect x="720" y="528" width="630" height="388" rx="22" fill="#F1EBFF" stroke="#D8DFEA" stroke-width="2"/><text x="748" y="574" font-size="24" font-weight="700" fill="#172033">线程 / 定时器 / 队列在哪里</text><text x="748" y="614" font-size="19" font-weight="400" fill="#172033"><tspan x="748" y="614">- read_thread_: 持续 read() 串口并喂给 parser</tspan><tspan x="748" y="644">- handshake_timer_: 每 500 ms 重发握手直到 ACTIVE</tspan><tspan x="748" y="674">- stats_timer_: 定期打印统计</tspan><tspan x="748" y="704">- OnServoCmdReceived: ROS 回调编码并发帧</tspan><tspan x="748" y="734">- FrameParser: 字节流状态机, 非 ROS 队列</tspan></text><rect x="50" y="946" width="1300" height="304" rx="22" fill="#EDF2F7" stroke="#D8DFEA" stroke-width="2"/><text x="78" y="992" font-size="24" font-weight="700" fill="#172033">参数从哪里进来</text><text x="78" y="1032" font-size="19" font-weight="400" fill="#172033"><tspan x="78" y="1032">- launch 加载 uart_bridge.yaml</tspan><tspan x="78" y="1062">- YAML 提供: uart_device / uart_baudrate</tspan><tspan x="78" y="1092">- 源码默认值: stats_report_interval_sec=10.0</tspan></text>
  </g>
  <text x="700" y="1320" text-anchor="middle" font-size="16" fill="#5B6475">仅覆盖 ros2_ws/src 中的真实 ROS 节点；不包含 vision_front 这类组合进程入口。</text>
</svg>
